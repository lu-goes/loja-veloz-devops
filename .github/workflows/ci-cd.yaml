name: CI/CD Pipeline - Loja Veloz

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build do projeto (simulado)
        run: echo "Build executado com sucesso"

      - name: Testes automatizados (simulado)
        run: echo "Testes executados com sucesso"

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker (simulado)
        run: echo "Imagem Docker criada"

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy no Kubernetes (simulado)
        run: echo "Deploy realizado no cluster Kubernetes"
